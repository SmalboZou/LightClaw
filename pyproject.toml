[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lightclaw"
version = "0.1.0"
description = "A lightweight personal AI agent framework inspired by OpenClaw-style systems."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=46.0,<47.0",
  "fastapi>=0.116,<1.0",
  "httpx>=0.28,<1.0",
  "pydantic>=2.11,<3.0",
  "PyYAML>=6.0,<7.0",
  "sqlalchemy>=2.0,<3.0",
  "typer>=0.16,<1.0",
  "uvicorn>=0.35,<1.0",
]

[project.optional-dependencies]
browser = [
  "playwright>=1.54,<2.0",
]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.26,<1.0",
]

[project.scripts]
lightclaw = "lightclaw.interfaces.cli.main:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
